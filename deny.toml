[advisories]
version = 2
ignore = []
# A yanked crate is withdrawn by its author for a reason. `warn` lets a yanked
# dependency sit in a release because CI was read as "green enough".
yanked = "deny"
# Dependencies of workspace crates must not be unmaintained; transitive ones are
# reported but do not fail the build until someone can act on them.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# The project itself is GPL-3.0-only, inherited from upstream OpenKey.
# Every entry below is one-way compatible with GPLv3; do not add copyleft
# licenses that are not (e.g. GPL-2.0-only, SSPL, Commons-Clause).
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
