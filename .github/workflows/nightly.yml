name: nightly

# tier 8 — WORKFLOW.md §3's nightly list: full corpus, differential fuzzing, benchmark
# regression against the previous `main`, dependency audit.
#
# Non-blocking by design. A nightly that blocks merges is a nightly people disable,
# so this never appears in required checks; it opens or updates one issue on failure
# and is read every working day. That last part is process, not code, and it is the
# only part of this file that can be wrong without the pipeline going red.

on:
  schedule:
    - cron: "0 2 * * *" # 09:00 ICT
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.0"

jobs:
  nightly:
    name: nightly suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable channel
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Full test suite (release profile)
        run: cargo test --workspace --all-targets --release --locked

      - name: Core purity and no-network
        run: |
          python3 scripts/ci/check-core-purity.py
          python3 scripts/ci/check-no-network.py

      - name: Dependency audit
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --locked

      # Corpus and fuzzing arrive with K-005 / C-014. Until then this step says so
      # by name rather than passing silently as "nothing to do".
      - name: Parity corpus and differential fuzzing
        run: |
          if [ -x scripts/parity.sh ]; then
            ./scripts/parity.sh --full
          else
            echo "::warning::scripts/parity.sh absent (K-005); nightly parity/fuzz not yet running"
          fi

      - name: Benchmark regression vs previous main
        run: |
          if cargo bench --workspace --no-run --locked >/dev/null 2>&1; then
            cargo bench --workspace --locked
          else
            echo "::warning::no benches in the workspace yet (C-014); regression check skipped"
          fi

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="nightly: failing gate on main"
          body=$(printf 'Run: %s/%s/actions/runs/%s\nCommit: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # ADR-0009. `secrets` in ci.yml scans `--log-opts=HEAD`, so a PR is not failed by commits
  # on branches it never contained. This is the other half: every ref, daily, same pinned
  # binary and same config. A secret that only ever existed on a deleted or never-opened
  # branch is found here and nowhere else. Scheduled rather than per-PR because that is
  # exactly the signal a per-PR gate cannot carry.
  secrets-history:
    name: secrets (all refs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch and tag: that is what this job is for
      - name: gitleaks (pinned, checksum-verified)
        run: scripts/ci/fetch-gitleaks.sh /tmp/gl
      # Same self-check as the per-PR gate: if the config stopped detecting, an empty
      # result here would read as a clean history.
      - name: Allowlist is as narrow as the ADR says, and the detector still fires
        run: python3 scripts/ci/test_gitleaks_config.py --gitleaks /tmp/gl/gitleaks
      - name: Scan every ref
        # No --log-opts: gitleaks 8.30.1 defaults to all refs, which is the point.
        run: /tmp/gl/gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="nightly: secrets history sweep found a leak"
          body=$(printf 'Run: %s/%s/actions/runs/%s\nCommit: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
