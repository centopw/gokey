# Pinned, not "stable": a moving compiler turns `main` red without a commit, and the
# same drift applies to release artefacts. Bump deliberately, in its own PR.
# `Cargo.toml`'s `rust-version` is the MSRV floor (what compiles); this is the
# toolchain CI and releases use. .github/workflows/*.yml carry the same value.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
